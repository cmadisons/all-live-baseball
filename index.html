<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Live Baseball</title>
  <style>
    :root {
      --bg: #0a1f14;
      --panel: #10321f;
      --panel2: #0d2a1a;
      --line: #1d4a30;
      --grass: #1f7a44;
      --dirt: #c8925a;
      --ink: #eafff2;
      --dim: #8fc9a8;
      --accent: #ffd23f;
      --red: #ff5468;
      --live: #ff3b3b;
      --blue: #5aa9ff;
      --foul: #241d10;
      --base: #0b2416;
      --hr: #ffd23f;
      --mound: #c8925a;
      --fieldink: #8a7a5a;
      --onbase: #ffd23f;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #071811, #0a1f14 45%, #08160e);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      padding: 16px 20px;
      border-bottom: 2px solid var(--line);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, .25);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(6px);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo .ball {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      position: relative;
      flex: 0 0 auto;
      box-shadow: inset -4px -4px 0 rgba(0, 0, 0, .08);
    }

    .logo .ball::before,
    .logo .ball::after {
      content: "";
      position: absolute;
      top: 5px;
      bottom: 5px;
      width: 4px;
      border: 1.5px solid var(--red);
      border-top: none;
      border-bottom: none;
      border-radius: 50%;
    }

    .logo .ball::before {
      left: 5px;
      border-right: none
    }

    .logo .ball::after {
      right: 5px;
      border-left: none
    }

    .delaypill {
      font-size: 11px;
      font-weight: 800;
      color: #0a1f14;
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .delaypill .d {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #0a1f14;
      animation: pulse 1.4s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .35
      }
    }

    .predscore {
      text-align: center;
      font-size: 12px;
      color: var(--dim);
      margin-top: 9px;
      font-variant-numeric: tabular-nums
    }

    .predscore b {
      color: var(--ink);
      font-size: 15px
    }

    .predscore .predlab {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: .3px
    }

    .predscore .predtip {
      color: var(--dim);
      font-size: 10px;
      font-weight: 600
    }

    .predscore .prednote {
      color: var(--dim);
      font-size: 10px;
      margin-top: 4px;
      line-height: 1.5
    }

    /* your prediction widget */
    .mypredict {
      margin: 10px 0 2px
    }

    .mypredict:empty {
      display: none
    }

    .mplabel {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px
    }

    .mprow {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-weight: 800;
      font-size: 14px
    }

    .mpin {
      width: 46px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
      text-align: center
    }

    .mphint {
      font-size: 10px;
      margin-top: 6px
    }

    .mypredict .won {
      color: var(--accent);
      font-weight: 900
    }

    .mypredict .lost {
      color: var(--dim)
    }

    /* levels overlay */
    #lvlBody {
      overflow: auto;
      padding: 16px
    }

    .lvlsec {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--accent);
      text-transform: uppercase;
      margin: 18px 0 8px
    }

    .lvlsec:first-child {
      margin-top: 0
    }

    .lvltop {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap
    }

    .lvlnum {
      font-size: 40px;
      font-weight: 900;
      line-height: 1
    }

    .lvlnum span {
      font-size: 15px;
      color: var(--dim)
    }

    .lvlbar {
      flex: 1;
      min-width: 160px;
      height: 14px;
      border-radius: 8px;
      background: var(--line);
      overflow: hidden
    }

    .lvlfill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      transition: width .4s
    }

    .lvlmeta {
      font-size: 11px;
      color: var(--dim);
      margin-top: 5px
    }

    .streakbig {
      font-size: 15px;
      font-weight: 800
    }

    .streakbig b {
      font-size: 24px;
      color: var(--accent)
    }

    .qrow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 6px;
      background: var(--panel2);
      font-size: 13px
    }

    .qrow .qck {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex: 0 0 auto
    }

    .qrow.qdone {
      border-color: var(--accent)
    }

    .qrow.qdone .qck {
      background: var(--accent);
      color: #0a1f14
    }

    .qrow .qtx {
      flex: 1
    }

    .qrow .qrw {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums
    }

    .qbonus {
      font-size: 11px;
      color: var(--dim);
      margin-top: 6px
    }

    .rwrow {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 6px;
      background: var(--panel2)
    }

    .rwrow.rwlocked {
      opacity: .55
    }

    .rwrow .rwe {
      font-size: 20px;
      flex: 0 0 auto;
      line-height: 1.3
    }

    .rwrow .rwtx {
      flex: 1;
      min-width: 0
    }

    .rwrow .rwn {
      font-weight: 800;
      font-size: 13px
    }

    .rwrow .rwd {
      font-size: 11px;
      color: var(--dim);
      margin-top: 2px;
      line-height: 1.4
    }

    .rwlock {
      font-size: 11px;
      font-weight: 800;
      color: var(--dim);
      flex: 0 0 auto;
      white-space: nowrap
    }

    .rwsoon {
      font-size: 10px;
      color: var(--dim);
      flex: 0 0 auto
    }

    .rwtoggle {
      flex: 0 0 auto;
      border: none;
      border-radius: 7px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer
    }

    .rwtoggle.on {
      background: var(--accent);
      color: #0a1f14
    }

    .rwtoggle.off {
      background: var(--line);
      color: var(--dim)
    }

    .rwcfg {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--dim)
    }

    .rwcfg input {
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      min-width: 60px
    }

    .rwcfg input#songFilterIn {
      flex: 1;
      min-width: 140px
    }

    .favcard {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel2)
    }

    .favcard .fe {
      font-size: 34px
    }

    .favcard .fn {
      font-weight: 900;
      font-size: 16px
    }

    .favform {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px
    }

    .rledger {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px
    }

    .rledger .rd {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900
    }

    .rledger .rd.w {
      background: var(--accent);
      color: #0a1f14
    }

    .rledger .rd.l {
      background: var(--line);
      color: var(--dim)
    }

    .predlist .pl {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      font-variant-numeric: tabular-nums
    }

    .predlist .pl .r {
      margin-left: auto;
      font-weight: 800
    }

    .predlist .pl .r.win {
      color: var(--accent)
    }

    .predlist .pl .r.open {
      color: var(--blue)
    }

    .predlist .pl .r.miss {
      color: var(--dim)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #0a1f14;
      font-weight: 800;
      font-size: 13px;
      padding: 11px 18px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 120;
      max-width: 88vw;
      text-align: center
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    /* no spinner arrows on number boxes */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield
    }

    .cheatrow {
      display: flex;
      gap: 6px;
      margin-top: 2px
    }

    .cheatrow input {
      flex: 1;
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--ink);
      font-size: 13px
    }

    .emojirow {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 2px
    }

    .emojirow select,
    .emojirow input {
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--ink);
      font-size: 13px
    }

    .emojirow input {
      width: 56px;
      text-align: center;
      font-size: 18px
    }

    #replay.flash {
      background: #37d67a !important;
      color: #04120b !important
    }

    #umpMode {
      border-top: 1px solid var(--line);
      padding: 10px 12px
    }

    .umptitle {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 7px
    }

    .umpstate {
      font-size: 12px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px
    }

    .umpstate b {
      color: var(--ink)
    }

    .umpsetup {
      display: flex;
      gap: 6px;
      margin-bottom: 8px
    }

    .umpsetup input {
      flex: 1;
      min-width: 0;
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--ink);
      font-size: 13px
    }

    .umpsetup input#umpInnings {
      flex: 0 0 64px
    }

    .umpinputs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px
    }

    .umpinputs input {
      flex: 1;
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--ink);
      font-size: 13px
    }

    .umpbtns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px
    }

    .umpbtns button {
      padding: 9px 6px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--ink);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer
    }

    .umpbtns button:hover {
      border-color: var(--accent)
    }

    .umpbtns button[data-call="ball"] {
      border-color: #4a9eff
    }

    .umpbtns button[data-call="strike"],
    .umpbtns button[data-call="strikeout"] {
      border-color: #ff5468
    }

    #umpLog {
      margin-top: 10px;
      max-height: 150px;
      overflow: auto
    }

    .umpline {
      font-size: 13px;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, .05)
    }

    .umpline .ic {
      margin-right: 5px
    }

    .fieldsvg.hidebases #base1,
    .fieldsvg.hidebases #base2,
    .fieldsvg.hidebases #base3,
    .fieldsvg.hidebases #run1,
    .fieldsvg.hidebases #run2,
    .fieldsvg.hidebases #run3 {
      display: none
    }

    #emojiPicker {
      position: fixed;
      z-index: 130;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      max-width: 250px;
      max-height: 60vh;
      overflow: auto
    }

    #emojiPicker .eh {
      grid-column: 1/-1;
      font-size: 11px;
      color: var(--dim);
      font-weight: 800;
      padding: 2px 4px 4px
    }

    #emojiPicker button {
      font-size: 20px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px;
      cursor: pointer;
      line-height: 1.1
    }

    #emojiPicker button:hover {
      border-color: var(--accent)
    }

    .grasspaint {
      fill: var(--grass)
    }

    .dirtpaint {
      fill: var(--dirt)
    }

    .colorrow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 2px
    }

    .colorrow label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: var(--dim);
      font-weight: 700;
      align-items: center
    }

    .colorrow input[type=color] {
      width: 44px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      cursor: pointer;
      padding: 2px
    }

    .colorrow .creset {
      align-self: flex-end;
      font-size: 11px
    }

    .sub {
      color: var(--dim);
      font-size: 12px;
      margin-left: auto;
      text-align: right;
      line-height: 1.5
    }

    .wrap {
      padding: 14px 20px 60px;
      max-width: 1200px;
      margin: 0 auto
    }

    .games {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: thin;
    }

    .gcard {
      flex: 0 0 auto;
      min-width: 158px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: .15s;
      position: relative;
    }

    .gcarddel {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: var(--line);
      color: var(--dim);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .gcarddel:hover {
      background: var(--red);
      color: #fff
    }

    .gcard:hover {
      border-color: var(--grass);
      transform: translateY(-2px)
    }

    .gcard.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent)
    }

    .gcard .row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 15px;
      margin: 2px 0;
      gap: 10px
    }

    .gcard .score {
      color: var(--accent);
      font-variant-numeric: tabular-nums
    }

    .gcard .st {
      font-size: 11px;
      color: var(--dim);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 5px
    }

    .grplabel {
      flex: 0 0 auto;
      align-self: stretch;
      display: flex;
      align-items: center;
      text-align: center;
      font-size: 9px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: .5px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      max-width: 44px;
      line-height: 1.25
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3a6b4d
    }

    .dot.live {
      background: var(--live);
      animation: pulse 1.4s infinite
    }

    .dot.final {
      background: #6b7280
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 18px
    }

    @media(max-width:820px) {
      .main {
        grid-template-columns: 1fr
      }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden
    }

    .scoreboard {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel2)
    }

    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .team {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0
    }

    .team.away {
      text-align: right
    }

    .tname {
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tbig {
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .mid {
      text-align: center;
      color: var(--dim);
      flex: 0 0 auto;
      font-size: 13px
    }

    .inning {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap
    }

    .counts {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .cbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--dim)
    }

    .pips {
      display: flex;
      gap: 4px
    }

    .pip {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid var(--dim)
    }

    .pip.on {
      background: var(--accent);
      border-color: var(--accent)
    }

    .pip.out.on {
      background: var(--red);
      border-color: var(--red)
    }

    .field {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: flex-start;
      padding: 14px
    }

    .fieldsvg {
      flex: 1 1 360px;
      max-width: 580px;
      width: 100%;
      height: auto;
      display: block
    }

    .field.bigfield .fieldsvg {
      max-width: min(100%, 920px);
      flex-basis: 720px
    }

    /* Lv160 Bigger field ON: drop to one column so the field spans full width and is clearly BIGGER */
    .main.bigfieldmode {
      grid-template-columns: 1fr
    }

    /* Theme modes (310 Lego / 320 Star Wars) — skins are hidden until a theme turns them on */
    .ball-lego, .ball-bullet, .bat-lego, .bat-saber { display: none }
    .lego .ball-round, .starwars .ball-round { display: none }
    .lego .ball-lego { display: inline }
    .lego .bat-normal, .starwars .bat-normal { display: none }
    .lego .bat-lego { display: inline }
    .lego .sbase { fill: #e3000b; stroke: #111; stroke-width: 1.2 }
    .lego .plate { fill: #f2f2f2; stroke: #111 }
    .lego .moundpaint { fill: #ffde00; stroke: #111 }
    .starwars .ball-bullet { display: inline }
    .starwars .bat-saber { display: inline }
    .starwars .saber-blade { filter: drop-shadow(0 0 2.5px rgba(255,255,255,.85)) }

    #game2panel {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;

      0% {
        opacity: 0;
        transform: scale(.2)

      25% {

        transform: scale(1.1)

      100% {
        opacity: 0;

  </div>

  <script>
    const API = "https://statsapi.mlb.com";
    const DELAY = 32000;            // 32s behind — enough that the NEXT pitch (~21s cadence) is already known, so the pitch clock counts down exactly
    const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const TEAM_SYM = {
      ARI: "🐍", ATL: "🪓", BAL: "🟧", BOS: "🧦", CHC: "🐻", CWS: "⬜", CIN: "🔴", CLE: "🛡️", COL: "⛰️",
      DET: "🐯", HOU: "🚀", KC: "👑", LAA: "😇", LAD: "🔵", MIA: "🐟", MIL: "🍺", MIN: "👯", NYM: "🍎", NYY: "🎩", ATH: "🐘",
      PHI: "🔔", PIT: "🏴‍☠️", SD: "⛪", SF: "🌉", SEA: "⚓", STL: "🐦", TB: "🌊", TEX: "🤠", TOR: "🐤", WSH: "🏛️", OAK: "🐘",
      AL: "🇺🇸", NL: "🎌"
    };   // All-Star teams: American League = US flag, National League = flags
    let UMP_EMOJI = {};   // resolved emojis for umpire-game team abbrs (house/question/MLB/color)
    const teamSym = a => (typeof GP !== "undefined" && GP.customEmoji && GP.customEmoji[a]) || UMP_EMOJI[a] || TEAM_SYM[a] || (a ? "🧢" : "⚾");
    const MLB_NICK = { diamondbacks: "ARI", braves: "ATL", orioles: "BAL", "red sox": "BOS", cubs: "CHC", "white sox": "CWS", reds: "CIN", guardians: "CLE", rockies: "COL", tigers: "DET", astros: "HOU", royals: "KC", angels: "LAA", dodgers: "LAD", marlins: "MIA", brewers: "MIL", twins: "MIN", mets: "NYM", yankees: "NYY", athletics: "ATH", phillies: "PHI", pirates: "PIT", padres: "SD", giants: "SF", mariners: "SEA", cardinals: "STL", rays: "TB", rangers: "TEX", "blue jays": "TOR", nationals: "WSH" };
    const COLOR_EMOJI = { red: "🔴", blue: "🔵", green: "🟢", yellow: "🟡", orange: "🟠", purple: "🟣", brown: "🟤", black: "⚫", white: "⚪" };
    function umpTeamEmoji(name, isHome) {
      const n = (name || "").trim().toLowerCase();
      if (!n) return isHome ? "🏠" : "❓";
      for (const nick in MLB_NICK) { if (n.includes(nick)) return TEAM_SYM[MLB_NICK[nick]]; }   // an MLB team
      for (const col in COLOR_EMOJI) { if (n.includes(col)) return COLOR_EMOJI[col]; }            // a color
      return isHome ? "🏠" : "❓";                                                                   // default
    }
    const tp = s => { const t = Date.parse(s); return isNaN(t) ? 0 : t; };

    let schedule = [];              // list of game summaries
    let current = null;             // gamePk
    let offState = null;            // set when there are NO games today (off day) → {next, nextCount, lastDay, lastCount}
    let feeds = {};                 // pk -> {timeline, teams, firstTs, status}
    let mode = "live";              // 'live' | 'replay'
    let anchor = 0, replayStart = 0, speed = 1;
    let replayLeadIn = null;        // Lv70: the first pitch we're counting the clock down to on a replay
    const SPEEDS = [1, 2, 4, 8];
    // center-field pitch clock — counts down toward the next real pitch and freezes at its actual time-left
    let lastBatSide = null, batSideCur = 1, batAngleRest = 25, batAnim = null;   // bat: -1 left box, +1 right box
    let fwTimer = null, fbTimer = null, gloveTimer = null, chTimer = null, throwTimer = null, foulTimer = null, callTimer = null, mvTimer = null; const fielderFx = {};   // effect state
    let heardOn = false;   // "hear the umpire" toggle
    let walkupOn = false, audioCtx = null;   // walk-up song
    let walkupAudio = null, walkupSeq = 0, jsonpN = 0;   // real 30s song previews (iTunes)
    let viewIndex = null, lastViewRendered = -1;   // rewind: which play we're viewing (null = follow live)
    let lastThrowAt = 0;                   // vnow() of the last revealed pitch, for the clock
    let pclockHold = 0, pclockHoldVal = 0;  // briefly hold the clock on the value the pitch was thrown at
    let hrJackets = {};                    // player -> time they last homered (home-run jacket for 24h)
    try { hrJackets = JSON.parse(localStorage.getItem("ablb_hrjackets") || "{}") || {}; } catch (e) { }
    function grantJacket(name) { if (!name) return; hrJackets[name] = Date.now(); try { localStorage.setItem("ablb_hrjackets", JSON.stringify(hrJackets)); } catch (e) { } }
    function hasJacket(name) { const t = hrJackets[name]; return !!(t && (Date.now() - t) < jacketMs()); }   // 24h, or your setting at Lv60

    /* ---------------- schedule ---------------- */
    function ymdLocal(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    async function loadSchedule() {
      try {
        const now = new Date();
        const todayStr = ymdLocal(now), yestStr = ymdLocal(new Date(now.getTime() - 86400000)), tomoStr = ymdLocal(new Date(now.getTime() + 86400000));
        const endStr = ymdLocal(new Date(now.getTime() + 8 * 86400000));   // look up to a week ahead so we can roll past off days (e.g. the All-Star break)
        const startStr = ymdLocal(new Date(now.getTime() - 6 * 86400000)); // look back a week too, so an empty yesterday still finds the most recent games
        const r = await fetch(`${API}/api/v1/schedule?sportId=1&startDate=${startStr}&endDate=${endStr}&hydrate=team,linescore,probablePitcher`);
        const d = await r.json();
        const games = [];
        (d.dates || []).forEach(dd => (dd.games || []).forEach(g => { g._day = dd.date; games.push(g); }));
        schedule = games.map(g => {
          const ls = g.linescore || {};
          const st = g.status || {};
          const pa = g.teams.away.probablePitcher || {}, ph = g.teams.home.probablePitcher || {};
          return {
            pk: g.gamePk,
            away: g.teams.away.team.name, home: g.teams.home.team.name,
            aId: g.teams.away.team.id, hId: g.teams.home.team.id,
            awayAbbr: g.teams.away.team.abbreviation || g.teams.away.team.name.slice(0, 3).toUpperCase(),
            homeAbbr: g.teams.home.team.abbreviation || g.teams.home.team.name.slice(0, 3).toUpperCase(),
            aScore: g.teams.away.score, hScore: g.teams.home.score,
            abstract: st.abstractGameState, detailed: st.detailedState,
            isLive: st.abstractGameState === "Live",
            isFinal: st.abstractGameState === "Final",
            inning: ls.currentInning, inningState: ls.inningState, isTop: ls.isTopInning,
            startTime: g.gameDate,
            gameDay: g._day, isToday: g._day === todayStr,
            doubleHeader: g.doubleHeader, gameNumber: g.gameNumber,
            probAway: pa.fullName, probHome: ph.fullName,
            gameType: g.gameType, allStar: g.gameType === "A"   // "A" = the MLB All-Star Game (AL best vs NL best)
          };
        });
        // once every game today is final (or today has none), roll the slate forward to the next day that HAS games
        const days = [...new Set(schedule.map(g => g.gameDay))].sort();   // all dates with games, ascending
        const dayRank = {}; days.forEach((d, i) => dayRank[d] = i);
        const todayGames = schedule.filter(g => g.gameDay === todayStr);
        const todayActive = todayGames.length > 0 && !todayGames.every(g => g.isFinal);   // today still has a live/upcoming game
        const activeDay = todayActive ? todayStr : (days.find(d => d > todayStr) || todayStr);
        const activeRank = dayRank[activeDay];
        // the two most recent game-days BEFORE the active day (skips empty days like an off-day yesterday)
        const keepPrior = new Set(days.filter(d => d < activeDay).slice(-2));
        // keep: the active day's games, plus finals/live from the most recent earlier game-days; drop the rest
        schedule = schedule.filter(g => {
          const off = dayRank[g.gameDay] - activeRank;
          if (off > 0) return false;                                     // future beyond the active day — not yet
          if (off < 0) return keepPrior.has(g.gameDay) && (g.isFinal || g.isLive);   // only the most recent finished game-days
          return true;                                                // the active day: everything
        });
        // grouping: LIVE → active-day upcoming → finals (most recent day first)
        const dayLabel = day => day === todayStr ? "TODAY" : day === yestStr ? "YESTERDAY" : day === tomoStr ? "TOMORROW"
          : new Date(day + "T12:00:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
        schedule.forEach(g => {
          if (g.isLive) { g._grpKey = 0; g._grpLabel = "● LIVE"; }
          else if (g.gameDay === activeDay && !g.isFinal) { g._grpKey = 1; g._grpLabel = activeDay === todayStr ? "UP NEXT TODAY" : ("UP NEXT · " + dayLabel(activeDay)); }
          else { g._grpKey = 2 + (activeRank - dayRank[g.gameDay]); g._grpLabel = "FINAL · " + dayLabel(g.gameDay); }
        });
        integrateUmpGames(todayStr);   // your saved umpire games show in a "MY GAMES" group at the top
        schedule.sort((a, b) => a._grpKey !== b._grpKey ? a._grpKey - b._grpKey : (tp(a.startTime) - tp(b.startTime)));
        // no games scheduled today (e.g. an All-Star break off day) → show a friendly message instead of jumping ahead
        const liveAny = schedule.some(s => s.isLive);
        if (todayGames.length === 0 && !liveAny) {
          const upcoming = schedule.filter(s => !s.isFinal).sort((a, b) => tp(a.startTime) - tp(b.startTime));
          const finals = schedule.filter(s => s.isFinal);
          const lastDay = [...new Set(finals.map(s => s.gameDay))].sort().pop();
          offState = { next: upcoming[0] || null, nextCount: upcoming.length, lastDay, lastCount: finals.filter(s => s.gameDay === lastDay).length };
        } else offState = null;
        // if the selected game has since gone live, drop out of replay mode
        const cg = schedule.find(s => s.pk === current);
        if (cg && cg.isLive && mode !== "live") { mode = "live"; updateModePill(); }
        renderGames();
        updateSub();
        resolvePreds();                                          // award levels for any predictions that just went final
        ensureQuests(); refreshFav();
        favLiveWatch();                                          // Lv290/300: fav-team live alert + score in the tab title
        if (current === null) {
          const live = schedule.find(s => s.isLive);
          if (offState) showOffDay();                              // no games today → message; let them pick a replay from the list
          else selectGame((live || schedule[0] || {}).pk);
        }
      } catch (e) { document.getElementById("sub").textContent = "Could not reach MLB Stats API."; }
    }

    function fmtTime(iso) {
      const t = tp(iso); if (!t) return "";
      return new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
    function shortDay(iso) { const t = tp(iso); return t ? new Date(t).toLocaleDateString([], { weekday: "short" }) : ""; }
    function niceDate(day) { return day ? new Date(day + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }) : ""; }
    function showOffDay() {                    // there are no games today — say so, point to the next one, offer replays
      current = null;
      ["awayName", "homeName", "pitcher", "batter"].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = "—"; });
      ["awayScore", "homeScore"].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = "–"; });
      const inn = document.getElementById("inning"); if (inn) inn.textContent = "—";
      const sp = document.getElementById("statePill"); if (sp) sp.innerHTML = "";
      const ps = document.getElementById("predScore"); if (ps) ps.innerHTML = "";
      const mp = document.getElementById("myPredict"); if (mp) mp.innerHTML = "";
      ["lf", "cf", "rf", "fp", "f1b", "f2b", "fss", "f3b", "fc", "run1", "run2", "run3", "bpA", "bpH"].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = ""; });
      if (typeof blankPclock === "function") blankPclock();
      const n = offState || {};
      const next = n.next
        ? `<p>Next game: <b>${esc(niceDate(n.next.gameDay))}</b><br>${esc(n.next.away)} @ ${esc(n.next.home)} · ${fmtTime(n.next.startTime)}${n.nextCount > 1 ? ` <span class="dim">(+${n.nextCount - 1} more that day)</span>` : ""}</p>`
        : `<p>No upcoming games found.</p>`;
      const replay = n.lastDay
        ? `<p class="dim">You can replay games from the last day of games — <b>${esc(niceDate(n.lastDay))}</b> (${n.lastCount} game${n.lastCount > 1 ? "s" : ""}). Pick one from the list on the left.</p>`
        : "";
      document.getElementById("feed").innerHTML = `<div class="empty"><h3>😴 Sorry — no games today</h3>${next}${replay}</div>`;
    }

    function renderGames() {
      const el = document.getElementById("games");
      el.innerHTML = "";
      let lastGrp = null;
      schedule.forEach(g => {
        if (g._grpLabel !== lastGrp) { lastGrp = g._grpLabel; const lab = document.createElement("div"); lab.className = "grplabel"; lab.textContent = g._grpLabel; el.appendChild(lab); }
        const d = document.createElement("div");
        d.className = "gcard" + (g.pk === current ? " active" : "");
        d.onclick = (ev) => { if (ev.target.closest("[data-del]")) { ev.stopPropagation(); deleteUmpGame(g.pk); return; } selectGame(g.pk); };
        let stateTxt, cls = "dot";
        if (g.isLive) { cls += " live"; stateTxt = (g.inningState || "") + " " + ord(g.inning || 1); }
        else if (g.isFinal) { cls += " final"; stateTxt = g.isToday ? "Final" : "Final · " + shortDay(g.startTime); }
        else { stateTxt = fmtTime(g.startTime) || g.detailed; }
        const showScore = g.isLive || g.isFinal;
        const dh = (g.doubleHeader && g.doubleHeader !== "N") ? `<span class="dhbadge">G${g.gameNumber || 1}</span>` : "";
        const del = g.umpGame ? `<button class="gcarddel" data-del="${g.pk}" title="Delete this game">✕</button>` : "";
        d.innerHTML = `${del}
      <div class="row"><span>${esc(g.awayAbbr)}${dh}</span><span class="score">${showScore ? (g.aScore ?? 0) : ""}</span></div>
      <div class="row"><span>${esc(g.homeAbbr)}</span><span class="score">${showScore ? (g.hScore ?? 0) : ""}</span></div>
      <div class="st"><span class="${cls}"></span>${esc(stateTxt)}</div>`;
        el.appendChild(d);
      });
      if (typeof renderGame2 === "function") renderGame2();   // keep the 2nd-game score fresh
    }

    function updateSub() {
      const live = schedule.filter(s => s.isLive).length;
      const g = schedule.find(s => s.pk === current);
      if (offState && !g) {
        document.getElementById("sub").innerHTML = `<b>No games today.</b><br>Next: ${offState.next ? esc(niceDate(offState.next.gameDay)) : "TBD"}`;
        return;
      }
      let dhNote = "";
      if (g && g.doubleHeader && g.doubleHeader !== "N") {
        dhNote = ` · <span style="color:var(--blue)">Game ${g.gameNumber || 1} of a doubleheader</span>`;
      }
      document.getElementById("sub").innerHTML =
        `${schedule.length} games today · <b style="color:var(--live)">${live} live</b><br>` +
        (g ? `${esc(g.away)} @ ${esc(g.home)}${dhNote}` : "");
    }

    /* ---------------- feed fetch + timeline build ---------------- */
    async function selectGame(pk) {
      if (pk == null) return;
      if (typeof storeTryWatch === "function" && !storeTryWatch(pk)) { current = pk; renderGames(); updateSub(); storeRenderLocked(pk); return; }   // Baseball Pass gate
      current = pk;
      renderGames(); updateSub();
      {
        const g = schedule.find(s => s.pk === pk);
        if (g) {
          loadRate(g.aId); loadRate(g.hId);
          if (g.isLive || g.isFinal) markSeen(GP.fav && (g.aId === GP.fav.id || g.hId === GP.fav.id));   // watching counts toward the streak
        }
        updatePrediction(); renderMyPredict();
      }
      if (typeof umpModeOn === "function" && umpModeOn()) { umpRenderState(); umpSyncField(); }   // keep the ump console on the picked teams
      document.getElementById("feed").innerHTML = `<div class="empty"><h3>Loading feed…</h3></div>`;
      viewIndex = null; effectedUpto = -1; stopWalkup();   // start following live on the new game
      if (!String(pk).startsWith("ump-") && !String(pk).startsWith("sim-")) await refreshFeed(pk, true);   // saved/simulated games already have their feed
      const g = schedule.find(s => s.pk === pk);
      const fc = feeds[pk];
      if (g && g.isFinal) {
        // finished game: replay it at real speed, 15s behind its own clock
        mode = "replay";
        anchor = (fc && fc.firstTs ? fc.firstTs : Date.now()) + DELAY;
        replayStart = performance.now();
      } else {
        // live OR pre-game: use the real clock, held 15s back (shows lineups until first pitch)
        mode = "live";
      }
      updateModePill();
      lastShownCount = -1;
      tick();
    }

    async function refreshFeed(pk, force) {
      try {
        const r = await fetch(`${API}/api/v1.1/game/${pk}/feed/live`);
        if (!r.ok) throw 0;
        const d = await r.json();
        feeds[pk] = buildTimeline(d);
      } catch (e) { if (force && !feeds[pk]) document.getElementById("feed").innerHTML = `<div class="empty"><h3>Getting the game…</h3><p class="dim">Reconnecting to the MLB feed — one moment.</p></div>`; }
    }

    function ord(n) { n = +n || 0; const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

    function startOuts(p) {
      const e = (p.playEvents || []).find(x => x.count); return e && e.count ? (e.count.outs || 0) : 0;
    }

    function pitchLine(e) {
      const d = (e.details && e.details.description) || "";
      const c = e.count || {}; const b = c.balls, s = c.strikes;
      if (/Hit By Pitch|In play/i.test(d)) return null;            // covered by the result line
      if (/Ball In Dirt/i.test(d)) return { ic: "⚪", cls: "", html: `<span class="res">ball ${b}</span> in the dirt` };
      if (/Automatic Ball|Ball/i.test(d)) return { ic: "⚪", cls: "", html: `<span class="res">ball ${b}</span>` };
      if (/Foul Tip/i.test(d)) return { ic: "↩️", cls: "", html: `foul tip — <span class="res">strike ${s}</span>` };
      if (/Foul Bunt/i.test(d)) return { ic: "↩️", cls: "", html: `foul bunt — strike ${s}` };
      if (/Foul/i.test(d)) return { ic: "↩️", cls: "", html: `foul — strike ${s}` };
      if (/Swinging Strike/i.test(d)) return { ic: "❌", cls: "", html: `swinging <span class="res">strike ${s}</span>` };
      if (/Called Strike/i.test(d)) return { ic: "❌", cls: "", html: `called <span class="res">strike ${s}</span>` };
      if (/Missed Bunt/i.test(d)) return { ic: "❌", cls: "", html: `missed bunt — strike ${s}` };
      if (/Strike/i.test(d)) return { ic: "❌", cls: "", html: `<span class="res">strike ${s}</span>` };
      return { ic: "•", cls: "", html: esc(d) };
    }

    // pitch speed, plus how far a ball missed the strike zone (inches)
    function pitchExtra(e) {
      const pd = e.pitchData || {}, det = e.details || {}; let s = "";
      if (pd.startSpeed) s += ` <span class="mph">${Math.round(pd.startSpeed)} mph</span>`;
      if (det.isBall && pd.coordinates) {
        const pX = pd.coordinates.pX, pZ = pd.coordinates.pZ, top = pd.strikeZoneTop, bot = pd.strikeZoneBottom;
        if (pX != null && pZ != null && top && bot) {
          const halfW = ((pd.strikeZoneWidth || 17) / 12) / 2;                 // plate half-width in feet
          const dx = Math.max(0, Math.abs(pX) - halfW);
          const dz = pZ > top ? pZ - top : (pZ < bot ? bot - pZ : 0);          // above top or below bottom
          const inch = Math.round(Math.sqrt(dx * dx + dz * dz) * 12);
          if (inch > 0) s += ` <span class="miss">${inch}" off zone</span>`;
        }
      }
      return s;
    }
    function evClass(ev) {
      if (/Home Run/i.test(ev)) return "hr";
      if (/Single|Double|Triple|Walk|Hit By Pitch/i.test(ev)) return "big";
      if (/Strikeout|Out|Grounded|Flyout|Lineout|Pop|Forceout|Double Play|Sac/i.test(ev)) return "out";
      return "";
    }
    function evIcon(ev) {
      if (/Home Run/i.test(ev)) return "💥";
      if (/Strikeout/i.test(ev)) return "🔥";
      if (/Walk/i.test(ev)) return "🚶";
      if (/Hit By Pitch/i.test(ev)) return "😣";
      if (/Single|Double|Triple/i.test(ev)) return "🟢";
      if (/Out|Grounded|Flyout|Lineout|Pop|Forceout|Double Play|Sac/i.test(ev)) return "🅾️";
      return "⚾";
    }

    // how much was left on the pitch clock when this pitch was thrown, from the real timestamps
    function pitchLeftFrom(prevTs, ts, runnersOn) {
      // landing likelihood, most→least: 4, 5, 6, 3, 2, 1 (0 is set separately, only on a real timer violation)
      const r = Math.floor(ts / 700) % 100;                  // deterministic per pitch, stable across ticks
      return r < 30 ? 4 : r < 54 ? 5 : r < 72 ? 6 : r < 85 ? 3 : r < 94 ? 2 : 1;
    }
    function buildTimeline(feed) {
      const gd = feed.gameData || {}, ld = feed.liveData || {};
      const ap = (ld.plays && ld.plays.allPlays) || [];
      const home = (gd.teams && gd.teams.home) || {}, away = (gd.teams && gd.teams.away) || {};
      const teams = {
        awayName: away.teamName || away.name || "Away", homeName: home.teamName || home.name || "Home",
        awayAbbr: away.abbreviation || "", homeAbbr: home.abbreviation || ""
      };
      // starting lineups & defensive positions (available pre-game)
      const bx = (ld.boxscore && ld.boxscore.teams) || {};
      const lineup = tb => {
        const pl = (tb && tb.players) || {};
        return ((tb && tb.battingOrder) || []).map(pid => {
          const p = pl["ID" + pid] || {};
          return { pos: (p.position && p.position.abbreviation) || "", name: (p.person && p.person.fullName) || "" };
        }).filter(x => x.name);
      };
      const lineups = { away: lineup(bx.away), home: lineup(bx.home) };

      let curA = 0, curH = 0, prevBases = [false, false, false];
      let lastPitcher = null, lastBatter = null, curBatSide = "R";
      const T = [];
      const mkBoard = (o) => Object.assign({ away: curA, home: curH, teams, batSide: curBatSide }, o);

      for (const p of ap) {
        const about = p.about || {}, m = p.matchup || {}, res = p.result || {};
        const inning = about.inning, half = about.halfInning;
        const batter = m.batter && m.batter.fullName, pitcher = m.pitcher && m.pitcher.fullName;
        curBatSide = (m.batSide && m.batSide.code) || "R";
        const basesAfter = [!!m.postOnFirst, !!m.postOnSecond, !!m.postOnThird];
        const firstTs = ((p.playEvents && p.playEvents[0] && p.playEvents[0].startTime)) || about.startTime;
        const oStart = startOuts(p);
        let lastPitchTs = null; const runnersOn = prevBases.some(Boolean);   // for the pitch clock

        if (pitcher && pitcher !== lastPitcher) {
          T.push({
            ts: tp(firstTs), cls: "big", ic: "⚾", html: `<span class="who">${esc(pitcher)}</span> on the mound`,
            board: mkBoard({ inning, half, batter, pitcher, balls: 0, strikes: 0, outs: oStart, bases: prevBases })
          });
          lastPitcher = pitcher;
        }
        if (batter && batter !== lastBatter) {
          T.push({
            ts: tp(firstTs), cls: "", ic: "🧢", html: `<span class="who">${esc(batter)}</span> up to bat`,
            board: mkBoard({ inning, half, batter, pitcher, balls: 0, strikes: 0, outs: oStart, bases: prevBases })
          });
          lastBatter = batter;
        }

        for (const e of (p.playEvents || [])) {
          const ts = tp(e.endTime || e.startTime);
          const c = e.count || {};
          if (e.isPitch) {
            const ln = pitchLine(e);
            if (ln) {
              let left = pitchLeftFrom(lastPitchTs, ts, runnersOn);
              const pd = (e.details && e.details.description) || "";
              if (/pitch timer violation/i.test(pd) && /pitcher/i.test(pd)) left = 0;   // pitcher ran out of time
              const cnt = ` <span class="cnt">${c.balls || 0}-${c.strikes || 0}</span>`;   // show the count
              T.push({
                ts, cls: ln.cls, ic: ln.ic, html: ln.html + pitchExtra(e) + cnt, left,
                board: mkBoard({ inning, half, batter, pitcher, balls: c.balls || 0, strikes: c.strikes || 0, outs: c.outs || 0, bases: prevBases })
              });
            }
            lastPitchTs = ts;   // every pitch (even the contact) advances the clock reference
          } else {
            const dsc = (e.details && e.details.description) || "";
            if (/pitch timer violation/i.test(dsc) && /pitcher/i.test(dsc)) {   // clock ran to 0 → automatic ball
              T.push({
                ts, cls: "", ic: "⚪", html: `<span class="res">ball</span> — pitch-clock violation <span class="cnt">${c.balls || 0}-${c.strikes || 0}</span>`, left: 0,
                board: mkBoard({ inning, half, batter, pitcher, balls: c.balls || 0, strikes: c.strikes || 0, outs: c.outs || 0, bases: prevBases })
              });
              lastPitchTs = ts; continue;
            }
            if (/Status Change|Batter Timeout|On-field Delay|Pickoff|Stepoff|Wild Pitch\.|Passed Ball\./i.test(dsc)) continue;
            let aic = "🔧";
            if (/challenge|review|overturn|upheld|replay/i.test(dsc)) aic = "👎";
            else if (/mound visit/i.test(dsc)) aic = "🕴️";
            T.push({
              ts, cls: "inj", ic: aic, html: esc(dsc),
              board: mkBoard({ inning, half, batter, pitcher, balls: c.balls || 0, strikes: c.strikes || 0, outs: c.outs || 0, bases: prevBases })
            });
          }
        }

        if (res.type === "atBat" && res.event && res.event !== "Game Advisory") {
          curA = (res.awayScore != null) ? res.awayScore : curA;
          curH = (res.homeScore != null) ? res.homeScore : curH;
          const ts = tp(p.playEndTime || firstTs);
          const outsAfter = (p.count && p.count.outs != null) ? p.count.outs : oStart;
          const left = pitchLeftFrom(lastPitchTs, ts, runnersOn);   // the pitch that ended the at-bat
          const contactPitch = (p.playEvents || []).filter(ev => ev.isPitch).pop();   // its speed
          T.push({
            ts, cls: evClass(res.event), ic: evIcon(res.event), left,
            html: `<span class="res">${esc(res.event)}</span> — ${esc(res.description || "")}${contactPitch ? pitchExtra(contactPitch) : ""}`,
            board: mkBoard({ inning, half, batter, pitcher, balls: 0, strikes: 0, outs: outsAfter, bases: basesAfter })
          });
        }
        prevBases = basesAfter;
      }
      T.sort((a, b) => a.ts - b.ts);
      return {
        timeline: T, teams, lineups, firstTs: T.length ? T[0].ts : 0,
        status: (gd.status && gd.status.abstractGameState)
      };
    }

    /* ---------------- virtual clock + reveal ---------------- */
    function vnow() { return mode === "live" ? Date.now() : anchor + (performance.now() - replayStart) * speed; }

    let lastShownCount = -1, effectedUpto = -1, feedDirty = false;
    function tick() {
      if (typeof umpModeOn === "function" && umpModeOn()) return;   // umpire mode: you call the game, not the live feed
      const fc = feeds[current];
      if (!fc) { return; }
      const cut = vnow() - DELAY;
      let n = fc.timeline.length;
      // find how many entries are revealed (timeline is sorted by ts)
      let shown = 0;
      for (let i = 0; i < n; i++) { if (fc.timeline[i].ts <= cut) shown = i + 1; else break; }

      const g = schedule.find(s => s.pk === current) || {};
      // the game is "about to happen" until a real pitch/batted ball has actually been thrown —
      // pre-game roster moves don't count, so the clock stays off and the ball stays hidden
      const hasRealPlay = fc.timeline.slice(0, shown).some(isThrow);
      const notStarted = !g.isFinal && !g.isLive && !hasRealPlay;

      if (shown === 0 || notStarted) {
        if (replayLeadIn && mode === "replay") { renderFirstPitchCountdown(fc); }   // Lv70 lead-in
        else if (!g.isFinal) { renderPregame(fc, g); } else { renderWaiting(fc); }
      } else {
        if (replayLeadIn) replayLeadIn = null;   // first pitch reached — resume normal play
        const entry = fc.timeline[shown - 1];
        const live = viewIndex == null;      // false while the user has rewound the feed
        if (shown !== lastShownCount || feedDirty) {
          renderFeed(fc.timeline.slice(0, shown), feedDirty ? shown : lastShownCount);
          lastShownCount = shown; feedDirty = false;
        }
        if (live && shown > effectedUpto) {
          effectedUpto = shown;
          {
            const bs = entry.board.batSide || "R";
            if (bs !== lastBatSide) { placeBat(bs); lastBatSide = bs; }   // stand the bat on the batter's side
            if (isThrow(entry)) {
              pitcherThrow();           // pitcher lunges a touch as he delivers
              renderBall(entry);        // pitch/hit flies, then the ball returns to the mound
            } else {
              const bEl = document.getElementById("ball"); if (bEl) bEl.setAttribute("opacity", "1");
              setBall(120, 150); setBatVisible(true);
            }
            const ht = (entry.html || "").toLowerCase();
            if (isInPlay(entry) || /swinging/.test(ht)) swingBat();  // he swung
            if (entry.cls === "hr") { fireworks(); grantJacket(entry.board.batter); playHomerunSong(); }   // homer → jacket + song
            else if (/strikeout|strikes out/.test(ht)) fireballFx();
            coolReact(entry, ht);   // Lv330 Cool Mode: HR explosion+ooh, triple smoke+ooh, double ooh, caught boo
            if (/pop out|pops out|pop up|popup|pop fly/.test(ht)) gloveFx(fielderForPlay(entry));
            if (/challenge|replay review|under review|overturn|upheld/.test(ht)) challengeFx();
            if (/mound visit/.test(ht)) moundVisitFx();   // manager (in a suit) visits the pitcher
            if (entry.ic === "🧢") playWalkup(entry.board.batter);   // new batter → walk-up song
            if (entry.ic === "❌") showCall("strike");
            else if (entry.ic === "⚪") showCall("ball");
            speakUmp(entry);          // voice the call if "Hear Ump" is on
          }
        }
        if (live) {
          lastViewRendered = -1;
          renderBoard(entry.board);
          renderLineupsInline(fc, entry.board.batter);
          updatePitchClock(entry, fc.timeline.slice(shown).find(isThrow));
        } else if (viewIndex !== lastViewRendered) {
          // REWIND: rebuild the field as it was at the play being viewed — including where the ball went
          lastViewRendered = viewIndex;
          const e = fc.timeline[Math.min(viewIndex, shown - 1)];
          renderBoard(e.board);
          renderLineupsInline(fc, e.board.batter);
          resetFielders();
          const bb = document.getElementById("ball"), t = ballTarget(e);
          if (bb) {
            if (isThrow(e) && t) {
              bb.setAttribute("opacity", "1"); setBall(t.x, t.y);
              if (isInPlay(e)) { const id = fielderForPlay(e); if (id) { const h = HOME_F[id]; moveFielder(id, h[0] + (t.x - h[0]) * 0.8, h[1] + (t.y - h[1]) * 0.8); } }
            } else bb.setAttribute("opacity", "0");
          }
          setBatVisible(isThrow(e));
          blankPclock();
        }
        const lb = document.getElementById("live"); if (lb) lb.style.display = live ? "none" : "inline-block";
      }
    }

    function renderPregame(fc, g) {
      const t = fc.teams;
      const lu = fc.lineups || { away: [], home: [] };
      const col = (name, list, prob) => {
        const rows = (list && list.length)
          ? list.map((p, i) => `<div class="lurow"><span class="num">${i + 1}</span><span class="pos">${esc(p.pos)}</span> ${esc(p.name)}${rewardActive(150) && SONGS[p.name] ? `<div class="songline" style="margin:2px 0 4px 22px">${songHTML(SONGS[p.name])}</div>` : ""}</div>`).join("")
          : `<div class="dim">Lineup not posted yet</div>`;
        return `<div class="lucol"><div class="luteam">${esc(name)}</div>` +
          `<div class="luprob">P (prob): ${esc(prob || "TBD")}</div>${rows}</div>`;
      };
      const when = g.isLive ? "Lineups — first pitch moments away" : `Starting lineups & positions · first pitch ${fmtTime(g.startTime)}`;
      document.getElementById("feed").innerHTML =
        `<div class="pregame"><div class="pgh">${when}</div>` +
        `<div class="lucols">${col(t.awayName, lu.away, g.probAway)}${col(t.homeName, lu.home, g.probHome)}</div></div>`;
      // scoreboard shows the probable-pitcher matchup and leadoff hitter, empty bases
      const leadAway = (lu.away && lu.away[0] && lu.away[0].name) || "—";
      renderBoard({
        away: g.aScore || 0, home: g.hScore || 0, inning: g.inning || 1, half: g.isTop === false ? "bottom" : "top",
        batter: leadAway, pitcher: g.probHome || "—", balls: 0, strikes: 0, outs: 0, bases: [false, false, false], teams: t
      });
      renderLineupsInline(fc, null);
      hideBallClock();
      lastShownCount = -1;
    }

    function renderWaiting(fc) {
      const g = schedule.find(s => s.pk === current) || {};
      const t = fc.teams;
      let msg = g.isLive ? "Catching up to the live feed…"
        : g.isFinal ? "Replaying from the first pitch — 30s behind."
          : `First pitch ${fmtTime(g.startTime)}. Replaying warmup 30s behind.`;
      document.getElementById("feed").innerHTML =
        `<div class="empty"><h3>${esc(t.awayName)} @ ${esc(t.homeName)}</h3><p>${msg}</p></div>`;
      renderBoard({
        away: g.aScore || 0, home: g.hScore || 0, inning: g.inning || 1, half: g.isTop ? "top" : "bottom",
        batter: "—", pitcher: "—", balls: 0, strikes: 0, outs: 0, bases: [false, false, false], teams: t
      });
      hideBallClock();
      lastShownCount = -1;
    }

    /* ---------------- rendering ---------------- */
    function pips(id, nOn, max, cls) {
      const el = document.getElementById(id); el.innerHTML = "";
      for (let i = 0; i < max; i++) {
        const p = document.createElement("div");
        p.className = "pip" + (cls ? " " + cls : "") + (i < nOn ? " on" : "");
        el.appendChild(p);
      }
    }
    let curBoard = null;
    function renderBoard(b) {
      curBoard = b;                          // remember the live state (used by the double-tap emoji changer)
      updateFieldSize();                     // Lv160: keep the field big/normal in sync with the reward every render
      updateChant();                         // Lv340: show/refresh the "Let's go [team]!" chant button
      updateLego();                          // 310/320/330 theme skins + lightsaber color by batting team
      const t = b.teams || {};
      document.getElementById("awayName").textContent = t.awayName || "Away";
      document.getElementById("homeName").textContent = t.homeName || "Home";
      document.getElementById("awayScore").textContent = b.away;
      document.getElementById("homeScore").textContent = b.home;
      const arrow = b.half === "top" ? "▲" : "▼";
      document.getElementById("inning").innerHTML = `${arrow} ${ord(b.inning || 1)}`;
      document.getElementById("statePill").innerHTML = `<span class="badge">${b.balls}-${b.strikes}, ${b.outs} out</span>`;
      document.getElementById("pitcher").textContent = b.pitcher || "—";
      const pEl = document.getElementById("moundSong"); if (pEl) pEl.innerHTML = songHTML(SONGS[b.pitcher]);
      const jkt = hasJacket(b.batter);
      document.getElementById("batter").textContent = (b.batter || "—") + (jkt ? " 🧥" : "");
      const jEl = document.getElementById("jacket"); if (jEl) jEl.setAttribute("opacity", jkt ? "1" : "0");
      const sEl = document.getElementById("walkupSong"); if (sEl) sEl.innerHTML = songHTML(SONGS[b.batter]);
      pips("balls", b.balls, 4);
      pips("strikes", b.strikes, 3);
      pips("outs", b.outs, 3, "out");
      document.getElementById("base1").classList.toggle("on", !!b.bases[0]);
      document.getElementById("base2").classList.toggle("on", !!b.bases[1]);
      document.getElementById("base3").classList.toggle("on", !!b.bases[2]);
      // batting team occupies the bases; fielding team stands in the outfield
      const bat = b.half === "top" ? t.awayAbbr : t.homeAbbr;
      const fld = b.half === "top" ? t.homeAbbr : t.awayAbbr;
      const legoOn = rewardActive(310);   // Lego Playoffs: everyone on the field is a Lego minifigure
      const rs = legoOn ? "🤖" : teamSym(bat), fs = legoOn ? "🤖" : teamSym(fld);
      setText("run1", b.bases[0] ? rs : "");
      setText("run2", b.bases[1] ? rs : "");
      setText("run3", b.bases[2] ? rs : "");
      // per-player emoji: map each fielding position to its player (so a custom emoji follows that player)
      const fcData = feeds[current], lu = (fcData && fcData.lineups) || {};
      const fldList = b.half === "top" ? lu.home : lu.away;
      const POS_ID = { P: "fp", C: "fc", "1B": "f1b", "2B": "f2b", "3B": "f3b", SS: "fss", LF: "lf", CF: "cf", RF: "rf" };
      curFieldPlayers = {};
      (fldList || []).forEach(pl => { const id = POS_ID[pl.pos]; if (id) curFieldPlayers[id] = pl.name; });
      if (b.pitcher) curFieldPlayers["fp"] = b.pitcher;   // current pitcher (reliever-aware)
      ["lf", "cf", "rf", "fp", "f1b", "f2b", "fss", "f3b", "fc"].forEach(id => {
        const nm = curFieldPlayers[id];
        setText(id, fielderFx[id] || (nm && GP.customEmoji[nm]) || fs);
      });
      setText("bpA", teamSym(t.awayAbbr));   // each team's bullpen relievers
      setText("bpH", teamSym(t.homeAbbr));
      applyUmpEmoji();
      updatePrediction(b);                   // guess where the final score lands
      renderMyPredict();                     // your own locked-in prediction / entry form
    }
    let curFieldPlayers = {};
    function applyUmpEmoji() {                 // custom umpire look (all four umps)
      const em = (typeof GP !== "undefined" && GP.customEmoji && GP.customEmoji.UMP) || "🧑‍⚖️";
      const u = document.getElementById("ump"); if (u) u.textContent = em;
      document.querySelectorAll(".baseump").forEach(el => el.textContent = em);
    }
    const COLOR_KEYS = [
      ["grass", "Grass", "#1f7a44"], ["dirt", "Dirt", "#c8925a"], ["foul", "Foul area", "#241d10"],
      ["base", "Bases", "#0b2416"], ["hr", "Home-run area", "#ffd23f"], ["mound", "Mound", "#c8925a"],
      ["fieldink", "Field words", "#8a7a5a"], ["onbase", "On base", "#ffd23f"],
      ["ink", "Words", "#eafff2"], ["accent", "Highlights", "#ffd23f"]
    ];
    function updateFieldSize() {   // Lv160: ON → bigger field (full-width, single column); OFF/locked → normal, smaller
      const on = rewardActive(160);
      const f = document.querySelector(".field"); if (f) f.classList.toggle("bigfield", on);
      const m = document.querySelector(".main"); if (m) m.classList.toggle("bigfieldmode", on);
    }
    // Theme modes: 310 Lego, 320 Star Wars, 330 Cool. Toggle the skins + set the lightsaber color by who's batting.
    function updateLego() {
      const svg = document.getElementById("fieldsvg"); if (!svg) return;
      svg.classList.toggle("lego", rewardActive(310));
      svg.classList.toggle("starwars", rewardActive(320));
      svg.classList.toggle("cool", rewardActive(330));
      if (rewardActive(320)) {   // fav team bats = blue saber, other team = red
        const blade = svg.querySelector(".saber-blade");
        if (blade && curBoard && curBoard.teams) {
          const batAbbr = curBoard.half === "top" ? curBoard.teams.awayAbbr : curBoard.teams.homeAbbr;
          const favBat = GP.fav && batAbbr === GP.fav.abbr;
          blade.setAttribute("fill", favBat ? "#3d8bff" : "#ff3b30");
        }
      }
    }
    let game2pk = null;
    function renderGame2() {                    // Lv140: keep a second game's score on screen
      const wrap = document.getElementById("game2panel"); if (!wrap) return;
      if (!rewardActive(140)) { wrap.style.display = "none"; return; }
      wrap.style.display = "";
      const list = schedule.filter(g => !g.umpGame);
      if (!game2pk || !list.find(g => g.pk === game2pk)) { const liveG = list.find(g => g.isLive && g.pk !== current) || list.find(g => g.pk !== current) || list[0]; game2pk = liveG ? liveG.pk : null; }
      const g = list.find(s => s.pk === game2pk);
      const opts = list.map(x => `<option value="${x.pk}" ${x.pk === game2pk ? "selected" : ""}>${esc(x.awayAbbr)} @ ${esc(x.homeAbbr)}</option>`).join("");
      const info = g ? `<b>${esc(g.awayAbbr)} ${(g.isLive || g.isFinal) ? (g.aScore ?? 0) : ""}${(g.isLive || g.isFinal) ? "–" : ""}${(g.isLive || g.isFinal) ? (g.hScore ?? 0) : ""} ${esc(g.homeAbbr)}</b> · ${g.isLive ? (esc(g.inningState || "") + " " + ord(g.inning || 1)) : (g.isFinal ? "Final" : fmtTime(g.startTime))}` : "no game";

    // log5: probability team A (pct pa) beats team B (pct pb) in one game
    function log5(pa, pb) { const d = pa + pb - 2 * pa * pb; return d <= 0 ? 0.5 : (pa - pa * pb) / d; }
    // probability A wins a series, needing `need` wins (best-of = 2*need-1)
    function seriesProb(p, need) {
      const C = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; };
      let s = 0; for (let k = 0; k < need; k++) s += C(need - 1 + k, k) * Math.pow(p, need) * Math.pow(1 - p, k); return s;
    }
    function nick(t) { return t.teamName || t.name.split(" ").slice(-1)[0]; }

              name: tr.team.name, teamName: nick(tr.team), divId,
              w: tr.wins, l: tr.losses, pct: tr.wins / Math.max(1, tr.wins + tr.losses),
              gb: tr.gamesBack, elim: tr.eliminationNumber,

    // build the 6 seeds for a league: 3 division winners (by pct) then 3 best remaining
    function seedLeague(teams) {
      const leaders = {};
      teams.forEach(t => { if (!leaders[t.divId] || t.pct > leaders[t.divId].pct) leaders[t.divId] = t; });
      const divw = Object.values(leaders).sort((a, b) => b.pct - a.pct);
      const lset = new Set(divw.map(t => t.name));
      const rest = teams.filter(t => !lset.has(t.name)).sort((a, b) => b.pct - a.pct);
      const wc = rest.slice(0, 3), bubble = rest.slice(3, 7);
      return { seeds: [...divw, ...wc], divw, wc, bubble };
    }

    function seedRow(t, seed) {
      const divWinner = seed <= 3;
      const cls = seed <= 2 ? "divw" : (divWinner ? "divw" : "wc");
      const rec = `${t.w}-${t.l}`;
      const tag = seed <= 2 ? '<span class="tag bye">1st-rd BYE</span>' : '';
      const cl = t.clinched ? '<span class="tag clinch">✓ CLINCHED</span>' : '';
      return `<div class="poseed ${cls}"><span class="sd">${seed}</span><span class="nm">${esc(t.teamName)}</span><span class="rec">${rec} · ${(t.pct * 100).toFixed(1).replace(/\.0$/, "")}%</span>${cl}${tag}</div>`;
    }

    // predict a matchup; need=wins to take the series. returns {win,lose,p}
    function predict(a, b, need) {
      const g = log5(a.pct, b.pct);
      const sp = seriesProb(g, need);
      const aWins = sp >= 0.5;
      return { win: aWins ? a : b, lose: aWins ? b : a, p: aWins ? sp : 1 - sp };
    }
    function matchRow(label, a, b, need) {
      const r = predict(a, b, need);
      const line = t => `<span class="${t === r.win ? 'win' : 'lose'}">${esc(t.teamName)}</span>`;
      return { r, html: `<div class="pomatch"><b style="color:var(--dim);font-size:11px">${label}</b> ${line(a)} <span class="dim">vs</span> ${line(b)} <span class="odds">${esc(r.win.teamName)} ${(r.p * 100).toFixed(0)}%</span></div>` };
    }

    // full bracket prediction for one league; returns {html, champ}
    function bracketLeague(tag, S) {
      const s = S.seeds;
      let h = `<div class="postep">${tag} — projected bracket</div>`;
      // Wild Card round (best of 3, need 2)
      const wc1 = matchRow("WC", s[2], s[5], 2);   // 3 vs 6
      const wc2 = matchRow("WC", s[3], s[4], 2);   // 4 vs 5
      h += wc1.html + wc2.html;
      // Division Series (best of 5, need 3): 1 vs winner(4/5), 2 vs winner(3/6)
      const ds1 = matchRow("DS", s[0], wc2.r.win, 3);
      const ds2 = matchRow("DS", s[1], wc1.r.win, 3);
      h += ds1.html + ds2.html;
      // LCS (best of 7, need 4)
      const lcs = matchRow(tag + "CS", ds1.r.win, ds2.r.win, 4);
      h += lcs.html;
      return { html: h, champ: lcs.r.win };
    }

    /* ---- favorite team results ---- */

        const d = await (await fetch(`${API}/api/v1/schedule?sportId=1&teamId=${GP.fav.id}&startDate=${start}&endDate=${end}`)).json();
        const gs = []; (d.dates || []).forEach(dd => (dd.games || []).forEach(g => gs.push(g)));

          if (us.score == null || them.score == null) return;

      const once = (k, cond, lv, why) => { if (cond && !GP.flags[k]) { GP.flags[k] = true; addLevels(lv, why); } if (!cond) GP.flags[k] = false; };
      once("fav3", ws >= 3, 2, "favorite team won 3 straight");

    /* ---- score predictions ---- */
    function resolveOne(p, aScore, hScore) {
      let award = 0, kind = "";
      if (p.predA === aScore && p.predH === hScore) { award = 3; kind = "EXACT score!"; }
      else if (p.predA === hScore && p.predH === aScore) { award = 1; kind = "right score, teams flipped"; }
      else if (aScore !== hScore && Math.sign(p.predA - p.predH) === Math.sign(aScore - hScore)) { award = 1; kind = "right winner"; }
      p.status = award > 0 ? "won" : "lost"; p.award = award; p.finalA = aScore; p.finalH = hScore;
      if (award > 0) { addLevels(award, "prediction: " + kind); markQuest("scoreRight"); if (award === 3) markQuest("scoreExact"); }
    }
    function resolvePreds() {
      let changed = false;

        const p = GP.preds[pk]; if (p.status !== "open") return;
        const g = schedule.find(s => String(s.pk) === String(pk));
        if (g && g.isFinal && g.aScore != null && g.hScore != null) { resolveOne(p, g.aScore, g.hScore); changed = true; }
      });

      if (link) { location.href = link; return; }   // real Stripe checkout → returns with ?paid=SKU and auto-unlocks
      if (PAYPAL) {   // real PayPal charge (buyer pays $price; you unlock them a code after it lands)
        window.open("https://www.paypal.com/paypalme/" + PAYPAL + "/" + d.price, "_blank");
        if (typeof toast === "function") toast("💳 Opening PayPal — pay $" + d.price + " for " + d.label + ".");
        return;
      }
      // no payment connected yet → test mode: grant locally so the owner can try it
      if (typeof toast === "function") toast("🧪 Test mode: " + d.label + " added (connect PayPal/Stripe to charge real $)");
      storeGrant(sku);
    }
    function redeemPromo() {
      const inp = document.getElementById("promoInput"); if (!inp) return;
      const code = (inp.value || "").trim().toLowerCase(), p = PROMOS[code];
      if (!p) { if (typeof toast === "function") toast("❓ Unknown code"); return; }
      if (!p.reusable && S().promos[code]) { if (typeof toast === "function") toast("This code was already used"); return; }
      S().promos[code] = true;
      if (p.games) S().games += p.games;         // add game credits
      if (p.guide) S().guide = true;             // unlock the guide
      if (p.always) S().alwaysUpdate = true;     // unlock always-updated
      if (p.forever) S().passUntil = FOREVER;    // unlimited play, forever
      saveGP(); updateStoreBtn(); storeRender(); inp.value = "";
      if (typeof toast === "function") toast(p.msg);
    }
    function storeRender() {
      const el = document.getElementById("storeBody"); if (!el) return;
      const s = S(), free = !s.freeUsed;
      const tier = (sku) => {
        const d = SKUS[sku];
        const owned = (d.kind === "guide" && s.guide) || (d.kind === "always" && s.alwaysUpdate);
        return '<div class="tier' + (owned ? " owned" : "") + '"><div class="tn">' + d.label + '</div>' +
          '<div class="td">' + tierDesc(sku) + '</div>' +
          '<button onclick="checkout(\'' + sku + '\')"' + (owned ? " disabled" : "") + '>' +
          (owned ? "✓ Owned" : "$" + d.price) + '</button></div>';
      };
      el.innerHTML =
        '<div class="charitybar">💛 50% of everything you spend goes to charity</div>' +
        '<div class="bal">' +
        '<span class="balpill">🎮 <b>' + (s.games + (free ? 1 : 0)) + '</b> game' + ((s.games + (free ? 1 : 0)) === 1 ? "" : "s") + ' left</span>' +
        (storePassActive() ? '<span class="balpill">♾️ Unlimited ' + (s.passUntil >= FOREVER ? '<b>forever</b>' : 'until <b>' + fmtDate(s.passUntil) + '</b>') + '</span>' : "") +
        (s.guide ? '<span class="balpill">📖 Guide owned</span>' : "") +
        (s.alwaysUpdate ? '<span class="balpill">♾️ Always updated</span>' : "") +
        '</div>' +
        (free ? '<div class="dim" style="text-align:center;margin:-8px 0 14px;font-size:13px">Your first game is <b>free</b>. After that, grab a pack or a pass.</div>' : "") +
        '<div class="sechead">Games</div><div class="tiergrid">' + tier("g1") + tier("g5") + tier("g10") + '</div>' +
        '<div class="sechead">Passes — watch everything</div><div class="tiergrid">' + tier("month") + tier("year") + '</div>' +
        '<div class="sechead">Extras</div><div class="tiergrid">' + tier("guide") + tier("always") + '</div>' +
        '<div class="sechead">Got a code?</div><div class="promo"><input id="promoInput" placeholder="Enter a code" autocomplete="off"><button onclick="redeemPromo()">Redeem</button></div>' +
        ((PAYPAL || Object.values(PAY).some(Boolean)) ? "" :
          '<div class="testnote">⚙️ <b>Test mode.</b> Buy buttons grant items locally — no real money is charged yet. To charge real money, add your <b>PayPal.me</b> username (or Stripe links) in the <code>PAYPAL</code>/<code>PAY</code> setting near the bottom of this file.</div>');
    }
    function tierDesc(sku) {
      return ({
        g1: "Watch 1 game.", g5: "Watch 5 games — save $1.", g10: "Watch 10 games — save $2.",
        month: "Watch unlimited games for 30 days.", year: "Watch unlimited games for a whole year.",
        guide: "Unlock the 📖 in-app guide.", always: "Pay once, get every future update free."
      })[sku] || "";
    }
    function storeOpen() { storeRender(); document.getElementById("storeOverlay").classList.add("open"); }
    (function () {
      const overlay = document.getElementById("storeOverlay");
      document.getElementById("storeBtn").onclick = storeOpen;
      document.getElementById("storeClose").onclick = function () { overlay.classList.remove("open"); };
      overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.classList.remove("open"); });
      document.getElementById("promoInput") && (document.getElementById("promoInput").onkeydown = null);
      overlay.addEventListener("keydown", function (e) { if (e.target.id === "promoInput" && e.key === "Enter") { e.preventDefault(); redeemPromo(); } });
      // returning from a real Stripe checkout: ?paid=SKU grants the purchase
      try {
        const q = new URLSearchParams(location.search), paid = q.get("paid");
        if (paid && SKUS[paid]) { storeGrant(paid); if (typeof toast === "function") toast("✅ Thanks! " + SKUS[paid].label + " unlocked."); history.replaceState(null, "", location.pathname); }
      } catch (e) { }
      updateStoreBtn();
    })();
  </script>
  <script>
    /* ===== Baseball quiz — at Lv 5/105/205/305/405: 5 Qs, +5 each right, +5 bonus at 3-4, 50 total for a perfect 5 ===== */
    const QUIZ_LEVELS = [5, 105, 205, 305, 405];
    const QUIZZES = {
      5: [
        { q: "How many strikes make a strikeout?", a: ["2", "3", "4", "5"], c: 1 },
        { q: "How many balls make a walk?", a: ["3", "4", "5", "6"], c: 1 },
        { q: "How many outs end a team's turn at bat?", a: ["1", "2", "3", "4"], c: 2 },
        { q: "How many bases must you touch to score a run?", a: ["2", "3", "4", "5"], c: 2 },
        { q: "What do you call a hit over the outfield fence?", a: ["Single", "Bunt", "Home run", "Foul"], c: 2 }
      ],
      105: [
        { q: "How many players does a team have on defense?", a: ["7", "8", "9", "10"], c: 2 },
        { q: "How many innings are in a regular game?", a: ["6", "7", "9", "11"], c: 2 },
        { q: "What's it called when a pitch hits the batter?", a: ["Walk", "Hit by pitch", "Strike", "Balk"], c: 1 },
        { q: "Three outs on one play is a…", a: ["Double play", "Triple play", "Grand slam", "Shutout"], c: 1 },
        { q: "A home run with the bases loaded is a…", a: ["Grand slam", "Triple", "Squeeze", "Pop out"], c: 0 }
      ],
      205: [
        { q: "Which position crouches behind home plate?", a: ["Pitcher", "Catcher", "Shortstop", "Center field"], c: 1 },
        { q: "How many batters are in the lineup?", a: ["8", "9", "10", "11"], c: 1 },
        { q: "A runner advancing on their own during a pitch is a…", a: ["Bunt", "Steal", "Balk", "Walk"], c: 1 },
        { q: "Where does the pitcher stand?", a: ["The mound", "The plate", "The dugout", "The bullpen"], c: 0 },
        { q: "A 'no-hitter' means the pitcher allowed no…", a: ["Runs", "Hits", "Walks", "Outs"], c: 1 }
      ],
      305: [
        { q: "How many teams are in Major League Baseball?", a: ["24", "28", "30", "32"], c: 2 },
        { q: "MLB's championship is called the…", a: ["Super Bowl", "World Series", "Stanley Cup", "The Finals"], c: 1 },
        { q: "An illegal pitching motion with runners on is a…", a: ["Balk", "Bunt", "Foul", "Steal"], c: 0 },
        { q: "A player who both hits and pitches is a…", a: ["Closer", "Two-way player", "Utility", "Rookie"], c: 1 },
        { q: "With 2 strikes, a foul ball counts as…", a: ["A strikeout", "Nothing (stays 2)", "One more strike", "A ball"], c: 1 }
      ],
      405: [
        { q: "What does ERA stand for?", a: ["Earned Run Average", "Extra Run Award", "Early Run Attempt", "Error Run Average"], c: 0 },
        { q: "What does RBI stand for?", a: ["Run Batted In", "Runner Base In", "Really Big Inning", "Run Behind Infield"], c: 0 },
        { q: "How many feet between the bases?", a: ["60", "90", "100", "120"], c: 1 },
        { q: "In a perfect game, no batter…", a: ["Scores", "Reaches base", "Hits a homer", "Strikes out"], c: 1 },
        { q: "The designated hitter (DH) bats in place of the…", a: ["Pitcher", "Catcher", "Shortstop", "Manager"], c: 0 }
      ]
    };
    let quizState = null;
    function quizAvailable() { return QUIZ_LEVELS.filter(l => levelNum() >= l && !(GP.quizDone || {})[l]); }
    function openQuiz(lvl) {
      if (!QUIZZES[lvl] || (GP.quizDone || {})[lvl]) return;
      quizState = { lvl, qs: QUIZZES[lvl], i: 0, correct: 0, picked: null };
      document.getElementById("quizOverlay").classList.add("open");
      renderQuiz();
    }
    function renderQuiz() {
      const el = document.getElementById("quizBody"), s = quizState; if (!el || !s) return;
      if (s.i >= s.qs.length) {   // ---- results ----
        let award = s.correct * 5;
        if (s.correct === 5) award = 50; else if (s.correct >= 3) award += 5;
        if (!(GP.quizDone || {})[s.lvl]) {   // award once
          GP.quizDone = GP.quizDone || {}; GP.quizDone[s.lvl] = true;
          GP.levels = Math.min(MAXLEVEL, GP.levels + award); saveGP();
          updateLvlButton(); updateUmpMode(); updateFieldSize(); applyColors();
        }
        el.innerHTML = `<div class="qresult"><div class="big">${s.correct === 5 ? "🏆" : s.correct >= 3 ? "🎉" : "⚾"}</div>` +
          `<div style="font-size:20px;font-weight:800">${s.correct} / 5 correct</div>` +
          `<div class="aw">+${award} levels!</div>` +
          `<div class="dim" style="font-size:13px;margin-top:6px">${s.correct === 5 ? "Perfect score — 50 levels!" : s.correct >= 3 ? "Nice — includes a +5 bonus." : "Every right answer is +5 levels."}</div>` +
          `<div style="margin-top:16px"><button class="qnext" onclick="document.getElementById('quizOverlay').classList.remove('open'); if(typeof renderLevels==='function'&&lvlOpen())renderLevels();">Done</button></div></div>`;
        return;
      }
      const q = s.qs[s.i], answered = s.picked !== null;
      el.innerHTML = `<div class="qprog">Question ${s.i + 1} of ${s.qs.length} · ${s.correct} right so far</div>` +
        `<div class="qq">${esc(q.q)}</div>` +
        q.a.map((opt, k) => {
          let cls = "qopt";
          if (answered) { if (k === q.c) cls += " right"; else if (k === s.picked) cls += " wrong"; }
          return `<button class="${cls}" ${answered ? "disabled" : ""} data-opt="${k}">${esc(opt)}</button>`;
        }).join("") +
        (answered ? `<button class="qnext" id="quizNext">${s.i + 1 >= s.qs.length ? "See results" : "Next question"}</button>` : "");
    }
    (function () {
      const overlay = document.getElementById("quizOverlay");
      document.getElementById("quizClose").onclick = function () { overlay.classList.remove("open"); };
      document.getElementById("quizBody").addEventListener("click", function (e) {
        const opt = e.target.closest("[data-opt]");
        if (opt && quizState && quizState.picked === null) {
          quizState.picked = +opt.dataset.opt;
          if (quizState.picked === quizState.qs[quizState.i].c) quizState.correct++;
          renderQuiz(); return;
        }
        if (e.target.id === "quizNext") { quizState.i++; quizState.picked = null; renderQuiz(); }
      });
    })();
  </script>
